<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supper Cycle</title>
<meta name="description" content="Dinner rotation tuned to season, weather and cycle phase.">
<meta name="theme-color" content="#F3F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Supper">

<style>
/* Layout: one column, sticky date header, iOS-style tab bar pinned to the bottom. System fonts only, so nothing downloads. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --sunk:#E7ECE5; --ink:#17201A; --muted:#5A665E; --line:#D7DED6;
  --accent:#2C6A4E; --accent-ink:#FFFFFF; --accent-soft:#DCEBE1;
  --warn:#8E5B00; --warn-soft:#F6EBD3; --bad:#A3303D; --bad-soft:#F6DFE1;
  --ph-menstrual:#B0344A; --ph-follicular:#2D73A0; --ph-ovulatory:#A86E0B; --ph-luteal:#6E4FA3;
  --cozy:#8F5428; --fresh:#167F7C; --grill:#B84B17;
  --scrim:rgba(14,20,16,.38);
  --f-display:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1A201C; --sunk:#232A25; --ink:#E6ECE7; --muted:#9AA69E; --line:#2F3832;
  --accent:#6CC497; --accent-ink:#0D1A12; --accent-soft:#1F3A2B;
  --warn:#E2B356; --warn-soft:#3A2F17; --bad:#F08A95; --bad-soft:#3D1F24;
  --ph-menstrual:#EF7B8F; --ph-follicular:#72B5E0; --ph-ovulatory:#E7B04D; --ph-luteal:#B59BEA;
  --cozy:#D9A06E; --fresh:#5CCBC6; --grill:#F08B5A; --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1A201C; --sunk:#232A25; --ink:#E6ECE7; --muted:#9AA69E; --line:#2F3832;
  --accent:#6CC497; --accent-ink:#0D1A12; --accent-soft:#1F3A2B;
  --warn:#E2B356; --warn-soft:#3A2F17; --bad:#F08A95; --bad-soft:#3D1F24;
  --ph-menstrual:#EF7B8F; --ph-follicular:#72B5E0; --ph-ovulatory:#E7B04D; --ph-luteal:#B59BEA;
  --cozy:#D9A06E; --fresh:#5CCBC6; --grill:#F08B5A; --scrim:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:4px}

.top{position:relative;background:var(--bg);max-width:640px;margin:0 auto;padding-block:12px 10px}
.top h1{margin:0;font:700 28px/1.1 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.top .sub{margin-top:2px;color:var(--muted);font-size:14px}
.ctx{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ctxchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;line-height:1.2}
.ctxchip .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.ctxchip .set{color:var(--muted);font-size:12px}

h2{margin:0;font:650 13px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h3{margin:0;font:650 20px/1.2 var(--f-display);text-wrap:balance}
.section{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:14px}
.hint{margin:0;color:var(--muted);font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.hero{padding:18px;gap:12px;border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.card.hero h3{font-size:24px}
.eyebrow{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-width:0;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .title{font-weight:600;overflow-wrap:anywhere}
.item .meta{color:var(--muted);font-size:14px;margin-top:2px}

.reasons{display:flex;flex-wrap:wrap;gap:6px}
.rs{font-size:13px;line-height:1.2;padding:4px 9px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.rs.good{background:var(--accent-soft);color:var(--ink)}
.rs.bad{background:var(--warn-soft);color:var(--warn)}
.rs.ph{background:color-mix(in srgb,var(--phc) 16%,var(--surface));color:var(--ink)}
.rs.ph::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--phc);margin-right:6px;vertical-align:1px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>.btn{flex:1 1 140px}

.banner{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--warn-soft);color:var(--ink)}
.banner.info{background:var(--accent-soft)}

.seg{display:flex;background:var(--sunk);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 10px;font-weight:600;font-size:14px;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.auto[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--ink)}
.chip.off{text-decoration:line-through;color:var(--muted)}
.chip .w{font-size:12px;font-weight:700}

.field{display:flex;flex-direction:column;gap:8px}
.field>span,.label{font-weight:650;font-size:15px}
.input,input[type=text],input[type=number],input[type=date],input[type=search],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;line-height:1.45}
input[type=number]{width:96px}
input[type=date]{min-width:0}

.ing{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.ingrow{display:flex;align-items:baseline;gap:8px;font-size:14px;flex-wrap:wrap}
.ingrow .amt{color:var(--muted);min-width:64px}
.ingrow .nm{font-weight:600}
.tag{font-size:12px;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag.n{background:var(--accent-soft);color:var(--ink)}
.tag.ask{background:var(--warn-soft);color:var(--warn);border:0;font-weight:650}
.pill{font-size:12px;font-weight:650;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.due{background:var(--accent-soft);color:var(--accent)}
.pill.over{background:var(--accent);color:var(--accent-ink)}
.pill.ex{background:var(--warn-soft);color:var(--warn)}

.timeline{display:flex;height:14px;border-radius:7px;overflow:hidden;position:relative;background:var(--sunk)}
.timeline>i{display:block;height:100%}
.tl-wrap{position:relative;padding-top:4px}
.tl-mark{position:absolute;top:-2px;width:3px;height:26px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.legend>span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--phc);margin-right:6px}
.bigphase{font:700 34px/1.05 var(--f-display);color:var(--phc)}

.plan-day{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start}
.plan-date{text-align:center;border-radius:12px;background:var(--sunk);padding:6px 0}
.plan-date b{display:block;font:700 20px/1.1 var(--f-display)}
.plan-date small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.plan-date.today{background:var(--accent);color:var(--accent-ink)}
.plan-date.today small{color:inherit}

.groc{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.groc:first-child{border-top:0}
.groc input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.groc .grow{flex:1;min-width:0}
.groc.done .gname{text-decoration:line-through;color:var(--muted)}
.gname{font-weight:600}
.gq{color:var(--muted);font-size:14px}

details>summary{cursor:pointer;color:var(--accent);font-weight:600;list-style:none;padding:6px 0}
details>summary::-webkit-details-marker{display:none}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs a{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600}
.tabs a svg{width:25px;height:25px}
.tabs a[aria-current="page"]{color:var(--accent)}

.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:calc(100% - env(safe-area-inset-top,0px) - 16px);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.panel-head h3{flex:1;text-align:center;font-size:17px}
.panel-head .btn{min-width:72px}
.panel-body{overflow:auto;-webkit-overflow-scrolling:touch;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.opt small{color:var(--muted);font-size:13px}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;padding:4px}
.empty{text-align:center;padding:28px 12px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{color:var(--ink);font:650 18px/1.2 var(--f-display)}
pre.copy{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;user-select:all;-webkit-user-select:all;overflow-x:auto}
@media (prefers-reduced-motion: no-preference){
  .panel{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>

/* ============ cycle ============ */
function cycleStats(){
  const ps = state.periods.slice().sort((a, b) => a.start < b.start ? -1 : 1);
  const gaps = [];
  for (let i = 1; i < ps.length; i++){ const g = diff(ps[i].start, ps[i - 1].start); if (g >= 18 && g <= 50) gaps.push(g); }
  const rg = gaps.slice(-6);
  const L = rg.length ? Math.round(rg.reduce((a, b) => a + b, 0) / rg.length) : 28;
  const lens = ps.filter(p => p.end).map(p => diff(p.end, p.start) + 1).filter(n => n >= 1 && n <= 12).slice(-6);
  const P = lens.length ? Math.round(lens.reduce((a, b) => a + b, 0) / lens.length) : 5;
  return {ps, L, P, nCycles: rg.length, nLens: lens.length};
}
function phaseOnDay(day, L, menEnd){
  if (day <= menEnd) return 'menstrual';
  if (day > L) return 'luteal';
  const ov = Math.max(L - 14, menEnd + 2);
  if (day < ov - 1) return 'follicular';
  if (day <= ov + 1) return 'ovulatory';
  return 'luteal';
}
function estPhase(date){
  const st = cycleStats(); const {ps, L, P} = st; const t = today();
  if (!ps.length) return {phase: null};
  let idx = -1;
  for (let i = 0; i < ps.length; i++) if (ps[i].start <= date) idx = i;
  if (idx < 0) return {phase: null};
  const last = ps[idx];
  let cycleStart = last.start;
  let menEnd = last.end ? diff(last.end, last.start) + 1 : P;
  let day = diff(date, cycleStart) + 1;
  let projected = false;
  if (date > t && idx === ps.length - 1){
    let next = add(cycleStart, L);
    if (next <= t) next = add(t, 1);
    if (date >= next){ const k = Math.floor(diff(date, next) / L); cycleStart = add(next, k * L); day = diff(date, cycleStart) + 1; menEnd = P; projected = true; }
  }
  if (day > L + 45) return {phase: null, stale: true};
  const phase = phaseOnDay(day, L, menEnd);
  let phaseStart = cycleStart;
  for (let d = 1; d <= day; d++){ if (phaseOnDay(d, L, menEnd) === phase){ phaseStart = add(cycleStart, d - 1); break; } }
  return {phase, day, cycleStart, phaseStart, L, P, menEnd, projected, late: day > L};
}

  return estPhase(date);
}

      const start = ph.phaseStart || add(ctx.date, -10);
      if (last && last >= start){ R.blocked = 'Already had it this ' + PH[target].toLowerCase() + ' phase'; }
      else { R.score += 40; why('Your ' + PH[target].toLowerCase() + ' meal', 'ph', 1, {phase: target}); }
    } else if (ph.phase){ R.score -= 25; why('Saved for ' + PH[target].toLowerCase(), 'bad', 6); }
    else { R.score += since === null ? 20 : Math.min(since / 28, 1.5) * 20; }
  } else {
    const F = Math.max(1, (m.sched && m.sched.days) || state.settings.defaultDays);
    if (since === null){ R.score += 35; why('Not made yet', 'good', 4); }
    else {
      const q = since / F;
      if (since === 0) R.blocked = 'Made today';
      else if (q < 0.5) R.blocked = 'Made ' + since + ' days ago';
      R.score += q < 1 ? 30 * q : 30 + 10 * Math.min(q - 1, 1.5);
      if (since - F >= 3) why('Overdue by ' + (since - F) + ' days', 'good', 3);
      else if (since >= F) why('Due now', 'good', 3);
      else why('Last made ' + since + ' days ago', 'n', 8);
    }
  }
  const map = ph.phase ? state.settings.phaseMap[ph.phase] : null;
  if (map){
    const {fin} = mealNutrients(m);
    let ns = 0;
    Object.entries(map).sort((a, b) => b[1] - a[1]).forEach(([n, w]) => {
      const src = fin[n];
      if (src && w > 0){
        ns += w * 8 * (src.length >= 2 ? 1.25 : 1);
        why(NUT[n] + (src.length ? ': ' + src.slice(0, 2).join(', ') : ''), 'ph', 2, {phase: ph.phase});
      }
    });
    R.score += Math.min(ns, 32);
  }
  if (ph.phase && (m.phases || []).includes(ph.phase)){ R.score += 12; why('Good for ' + PH[ph.phase].toLowerCase(), 'ph', 2, {phase: ph.phase}); }
  const mv = m.vibes || [];
  if (ctx.vibes.size && mv.length){
    const hit = mv.find(v => ctx.vibes.has(v));
    if (hit){ R.score += 15; why(VIBE[hit].label + ' weather', 'good', 2); }
    else {
      const clash = mv.find(v => (VIBE_CLASH[v] || []).some(c => ctx.vibes.has(c)));
      if (clash){ R.score -= 15; why('Not a ' + VIBE[clash].label.toLowerCase() + ' day', 'bad', 5); }
    }
  }
  if (m.months && m.months.length && m.months.length < 12){
    if (m.months.includes(monthOf(ctx.date))){ R.score += 8; why('In season', 'good', 5); }
    else { R.score -= 25; why('Out of season', 'bad', 5); }
  }
  if (ctx.share && ctx.share.size){
    const shared = [];
    (m.ings || []).forEach(i => { const info = ingInfo(i.name); if (info && !info.pantry && ctx.share.has(info.key) && !shared.includes(cleanName(i.name))) shared.push(cleanName(i.name)); });
    if (shared.length){ R.score += Math.min(shared.length * 6, 18); why('Uses up ' + shared.slice(0, 2).join(', '), 'good', 4); }
  }
  R.score += (hash(ctx.date + ':' + ctx.seed + ':' + m.id) % 500) / 100;
  R.reasons.sort((a, b) => a.p - b.p);
  return R;
}
function rank(ctx){
  const out = [];
  for (const m of state.meals){
    if (m.active === false || ctx.exclude.has(m.id)) continue;
    out.push(Object.assign({m}, scoreMeal(m, ctx)));
  }
  const ok = out.filter(x => !x.blocked).sort((a, b) => b.score - a.score);
  const blocked = out.filter(x => x.blocked).sort((a, b) => b.score - a.score);
  return {ok, blocked};
}

function schedText(m){
  if (m.sched && m.sched.type === 'phase') return 'Once per ' + PH[m.sched.phase].toLowerCase() + ' phase';

function mealStatus(m){
  const t = today();

  if (m.sched && m.sched.type === 'phase') return {pill: '<span class="pill" style="color:' + phaseVar(m.sched.phase) + '">' + PH[m.sched.phase] + '</span>', last};
  if (!last) return {pill: '<span class="pill due">New</span>', last};

  if (since - F >= 3) return {pill: '<span class="pill over">Overdue</span>', last};
  if (since >= F) return {pill: '<span class="pill due">Due</span>', last};
  return {pill: '<span class="pill">Resting</span>', last};
}

function planContexts(days){
  const planned = [];
  return days.map(d => {
    const others = days.filter(x => x.mealId && x.date !== d.date).map(x => x.mealId);
    const share = shareSet(planned.map(p => p.mealId));
    const ctx = ctxFor(d.date, {planned: planned.slice(), share, exclude: new Set(others)});
    if (d.mealId) planned.push({date: d.date, mealId: d.mealId});
    return ctx;
  });
}
function shareSet(ids){
  const s = new Set();
  ids.forEach(id => { const m = mealById(id); if (!m) return; m.ings.forEach(i => { const info = ingInfo(i.name); if (info && !info.pantry) s.add(info.key); }); });
  return s;
}
function buildPlan(){
  const cfg = state.planCfg; const start = add(today(), cfg.offset); const n = cfg.n;
  const old = state.plan;
  const days = [];
  for (let i = 0; i < n; i++){
    const date = add(start, i);
    const keep = old && old.days.find(d => d.date === date && d.locked && mealById(d.mealId));
    days.push(keep ? Object.assign({}, keep) : {date, mealId: null, locked: false, skip: []});
  }
  const lockedIds = new Set(days.filter(d => d.locked).map(d => d.mealId));
  const planned = [];
  days.forEach(d => {
    if (!d.locked){
      const used = new Set([...lockedIds, ...planned.map(p => p.mealId)]);
      const ctx = ctxFor(d.date, {planned: planned.slice(), share: shareSet(planned.map(p => p.mealId)), exclude: used});
      const {ok, blocked} = rank(ctx);
      const pick = ok[0] || blocked[0];
      d.mealId = pick ? pick.m.id : null;
    }
    if (d.mealId) planned.push({date: d.date, mealId: d.mealId});
  });
  state.plan = {start, days, checked: (old && old.checked) || {}};
  save();
}
function swapDay(date){
  const p = state.plan; const idx = p.days.findIndex(d => d.date === date); const d = p.days[idx];
  d.skip = d.skip || [];
  if (d.mealId) d.skip.push(d.mealId);
  const planned = p.days.slice(0, idx).filter(x => x.mealId).map(x => ({date: x.date, mealId: x.mealId}));
  const others = new Set(p.days.filter(x => x.date !== date && x.mealId).map(x => x.mealId));
  const tryPick = () => {
    const ctx = ctxFor(date, {planned, share: shareSet(planned.map(x => x.mealId)), exclude: new Set([...others, ...d.skip])});
    const {ok, blocked} = rank(ctx); return ok[0] || blocked[0];
  };
  let pick = tryPick();
  if (!pick){ d.skip = d.mealId ? [d.mealId] : []; pick = tryPick(); }
  d.mealId = pick ? pick.m.id : d.mealId;
  d.locked = false;
  save();
}
function groceryList(){
  const p = state.plan; if (!p) return {buy: [], pantry: []};
  const groups = new Map();
  p.days.forEach(d => {
    const m = d.mealId && mealById(d.mealId); if (!m) return;
    m.ings.forEach(i => {
      const key = norm(cleanName(i.name)) || norm(i.name);
      const info = ingInfo(i.name);
      let g = groups.get(key);
      if (!g){ g = {key, name: cleanName(i.name) || i.name, sums: {}, texts: [], meals: [], pantry: !!(info && info.pantry)}; groups.set(key, g); }
      const a = amountParse(i.amt);
      if (a.n != null) g.sums[a.u] = (g.sums[a.u] || 0) + a.n;
      else if (i.amt) g.texts.push(i.amt);
      if (!g.meals.includes(m.name)) g.meals.push(m.name);
    });
  });
  const list = [...groups.values()].map(g => {
    const parts = Object.entries(g.sums).map(([u, n]) => fmtQty(n, u)).concat(g.texts);
    return Object.assign(g, {qty: parts.join(' + ')});
  }).sort((a, b) => a.name.localeCompare(b.name));
  return {buy: list.filter(g => !g.pantry), pantry: list.filter(g => g.pantry)};
}

  }).join('') + '</div>';
}

function viewCycle(){
  const t = today();
  const st = cycleStats();
  const ph = estPhase(t);
  $('#top').innerHTML = headerHTML('Cycle', st.ps.length ? 'Estimated from ' + st.ps.length + ' logged period' + (st.ps.length > 1 ? 's' : '') : 'Log periods to estimate phases');
  const out = [];
  if (!st.ps.length){
    out.push('<div class="card"><h3>When did your last period start?</h3><p class="hint">One date is enough to begin. The estimate improves as you log more cycles.</p><div class="row"><input type="date" id="firstStart" max="' + t + '" value="' + t + '"><button class="btn primary" data-act="addFirst">Save</button></div></div>');
  } else {
    const last = st.ps[st.ps.length - 1];
    const next = add(last.start, st.L);
    const lateBy = diff(t, next);
    out.push('<div class="card hero" style="--phc:' + phaseVar(ph.phase) + '"><div class="eyebrow" style="color:var(--phc)">Today' + (ph.day ? ' · day ' + ph.day : '') + '</div>' +
      '<div class="bigphase">' + (ph.phase ? PH[ph.phase] : 'Unknown') + '</div>' +
      '<div class="small muted">' + (ph.phase ? (lateBy > 0 ? 'Period expected ' + lateBy + ' day' + (lateBy > 1 ? 's' : '') + ' ago.' : 'Next period around ' + fmtDate(next, {weekday:'short', month:'short', day:'numeric'}) + '.') : 'Last logged period is too old to estimate from. Log the latest one.') + '</div>' +
      (ph.phase ? timelineHTML(ph) : '') + '</div>');
    const open = last && !last.end && diff(t, last.start) <= 14;
    out.push('<div class="btns">' + (open ? '<button class="btn primary" data-act="periodEnd">Period ended today</button>' : '<button class="btn primary" data-act="periodStart">Period started today</button>') + '<button class="btn" data-act="periodOther">Log another date</button></div>');
    out.push('<p class="hint">Average cycle ' + st.L + ' days' + (st.nCycles ? ' (from ' + st.nCycles + ' cycle' + (st.nCycles > 1 ? 's' : '') + ')' : ' (default until two periods are logged)') + '. Bleeding ' + st.P + ' days' + (st.nLens ? '' : ' (default; log end dates to refine)') + '. Ovulation is estimated 14 days before the next period, so phase edges can be off by a few days.</p>');
    out.push('<section class="section"><h2>Logged periods</h2><div class="list">' + st.ps.slice().reverse().slice(0, 12).map(p => '<div class="item"><div class="grow"><div class="title">' + fmtDate(p.start, {month:'short', day:'numeric', year:'numeric'}) + '</div><div class="meta">' + (p.end ? (diff(p.end, p.start) + 1) + ' days, ended ' + fmtDate(p.end, {month:'short', day:'numeric'}) : 'No end date') + '</div></div><button class="btn sm danger" data-act="delPeriod" data-start="' + p.start + '" data-confirm="Delete?">Remove</button></div>').join('') + '</div></section>');
  }
  out.push('<section class="section"><h2>What each phase favors</h2><p class="hint">Meals with these nutrients rank higher during that phase. Tap to cycle: off, on, strong (×2).</p>');
  PH_KEYS.forEach(p => {
    const map = state.settings.phaseMap[p] || {};
    out.push('<div class="card" style="--phc:' + phaseVar(p) + '"><div class="label" style="color:var(--phc)">' + PH[p] + '</div><div class="chips">' + Object.keys(NUT).map(n => {
      const w = map[n] || 0;
      return '<button class="chip" data-act="phaseNut" data-p="' + p + '" data-n="' + n + '" aria-pressed="' + (w > 0) + '">' + NUT[n] + (w > 1 ? ' <span class="w">×2</span>' : '') + '</button>';
    }).join('') + '</div></div>');
  });
  out.push('<p class="hint">Iron during bleeding has the clearest basis: you are replacing what is lost, and vitamin C in the same meal helps absorb iron from plants. Most other phase-food pairings rest on weaker evidence, so treat them as preferences and edit freely.</p><button class="btn ghost sm" data-act="resetPhaseMap" data-confirm="Tap again to reset">Reset to defaults</button></section>');
  return out.join('');
}
function timelineHTML(ph){
  const L = ph.L, segs = [];
  let cur = null, count = 0;
  for (let d = 1; d <= L; d++){
    const p = phaseOnDay(d, L, ph.menEnd);
    if (p !== cur){ if (cur) segs.push([cur, count]); cur = p; count = 0; }
    count++;
  }
  segs.push([cur, count]);
  const pos = Math.min(ph.day, L) - .5;
  return '<div class="tl-wrap"><div class="timeline" aria-hidden="true">' + segs.map(([p, c]) => '<i style="width:' + (c / L * 100) + '%;background:' + phaseVar(p) + '"></i>').join('') + '</div><div class="tl-mark" style="left:' + (pos / L * 100) + '%"></div></div>' +
    '<div class="legend">' + segs.map(([p, c]) => '<span style="--phc:' + phaseVar(p) + '">' + PH[p] + ' <span class="num">' + c + 'd</span></span>').join('') + '</div>';
}

/* ============ actions ============ */
let toastTimer = null;
function toast(msg, undo){
  const el = $('#toast');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button data-act="toastUndo">Undo</button>' : '');
  toast.undo = undo || null;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; toast.undo = null; }, undo ? 6000 : 2600);
}
function setOverride(date, key, val){
  const o = state.overrides[date] || {};
  if (val == null) delete o[key]; else o[key] = val;
  if (Object.keys(o).length) state.overrides[date] = o; else delete state.overrides[date];
  save();
}
function armed(el){
  if (!el.dataset.confirm) return true;
  if (el.dataset.armed === '1') return true;
  el.dataset.armed = '1';
  el.dataset.label = el.innerHTML;
  el.classList.add('armed');
  el.textContent = el.dataset.confirm;
  setTimeout(() => { if (el.isConnected && el.dataset.armed === '1'){ el.dataset.armed = ''; el.classList.remove('armed'); el.innerHTML = el.dataset.label; } }, 3500);
  return false;
}
async function copyText(text, fallbackTarget){
  try { await navigator.clipboard.writeText(text); toast('Copied'); }
  catch (e) {
    openSheet('Copy this', '<p class="hint">Press and hold to select, then copy.</p><pre class="copy">' + esc(text) + '</pre>');
  }
}
async function exportData(){
  const json = JSON.stringify(state);
  const name = 'supper-cycle-backup-' + today() + '.json';
  const done = () => { state.lastBackup = today(); save(); render(); toast('Backup saved'); };
  try {
    const file = new File([json], name, {type: 'application/json'});
    if (navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: 'Supper Cycle backup'}); done(); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    const url = URL.createObjectURL(new Blob([json], {type: 'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    done();
  } catch (e) { copyText(json); }
}
function importFile(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const obj = JSON.parse(r.result);
      if (!obj || !Array.isArray(obj.meals)) throw new Error('bad');
      openSheet('Restore backup', '<p>This backup has <b>' + obj.meals.length + ' meals</b> and <b>' + (obj.log || []).length + ' logged dinners</b>. Restoring replaces everything on this phone.</p><button class="btn danger wide" data-act="doImport">Replace my data</button>');
      importFile.pending = obj;
    } catch (e) { toast('That file is not a Supper Cycle backup.'); }
  };
  r.readAsText(file);
}

  madeOther: el => {
    const date = el.dataset.date;
    mealPicker('What did you make?', id => { logMeal(id, date, true); }, true);
  },
  undoToday: () => { const t = today(); const prev = JSON.stringify(state.log); state.log = state.log.filter(e => e.date !== t); save(); render(); toast('Cleared tonight', () => { state.log = JSON.parse(prev); save(); render(); }); },
  confirmYes: el => { const e = state.log.find(x => x.id === el.dataset.id); if (e){ e.confirmed = true; save(); } render(); },
  confirmOut: el => { const e = state.log.find(x => x.id === el.dataset.id); if (e){ logOut(e.date); } render(); },
  confirmOther: el => { const e = state.log.find(x => x.id === el.dataset.id); if (!e) return; const date = e.date; mealPicker('What did you make?', id => { logMeal(id, date, true); }, true); },
  pickMeal: el => { const f = mealPicker.pick; closeSheet(); f(el.dataset.id); render(); },
  pickNew: () => {
    const m = newMeal(ui.pickQ.trim()); m.needsDetails = true; state.meals.push(m); save();
    const f = mealPicker.pick; closeSheet(); f(m.id); render();
  },
  clearExamples: el => { if (!armed(el)) return; state.meals = state.meals.filter(m => !m.example); state.log = state.log.filter(e => !e.example); if (state.plan) state.plan.days.forEach(d => { if (d.mealId && !mealById(d.mealId)) d.mealId = null; }); save(); render(); toast('Examples cleared'); },
  loadExamples: () => { const ex = defaultState(true); const names = new Set(state.meals.map(m => norm(m.name))); ex.meals.forEach(m => { if (!names.has(norm(m.name))){ state.meals.push(m); state.log.push(...ex.log.filter(e => e.mealId === m.id)); } }); save(); render(); toast('Examples added'); },
  planOffset: el => { state.planCfg.offset = +el.dataset.v; save(); render(); },
  planN: el => { state.planCfg.n = Math.min(7, Math.max(2, state.planCfg.n + (+el.dataset.v))); save(); render(); },
  buildPlan: () => { buildPlan(); render(); },
  clearPlan: el => { if (!armed(el)) return; state.plan = null; save(); render(); },
  swap: el => { swapDay(el.dataset.date); render(); },
  lock: el => { const d = state.plan.days.find(x => x.date === el.dataset.date); d.locked = !d.locked; save(); render(); },
  choose: el => { const date = el.dataset.date; mealPicker('Dinner for ' + fmtDate(date), id => { const d = state.plan.days.find(x => x.date === date); d.mealId = id; d.locked = true; save(); }, true); },
  check: el => { const p = state.plan; p.checked = p.checked || {}; if (el.checked) p.checked[el.dataset.key] = true; else delete p.checked[el.dataset.key]; save(); el.closest('.groc').classList.toggle('done', el.checked); },
  copyList: () => {
    const g = groceryList(); const p = state.plan;
    const lines = ['Groceries, ' + fmtDate(p.days[0].date) + ' to ' + fmtDate(p.days[p.days.length - 1].date)];
    g.buy.filter(x => !(p.checked || {})[x.key]).forEach(x => lines.push('- ' + x.name + (x.qty ? ' (' + x.qty + ')' : '')));
    copyText(lines.join('\n'));
  },
  mealsTab: el => { ui.mealsTab = el.dataset.v; render(); },
  editMeal: el => openEditor(el.dataset.id || null),
  logPast: () => {
    openSheet('Log a past dinner', '<label class="field"><span>Date</span><input type="date" id="pastDate" max="' + today() + '" value="' + add(today(), -1) + '"></label><button class="btn primary wide" data-act="pastPick">Choose the meal</button><button class="btn wide" data-act="pastOut">We ate out that night</button>');
  },
  pastPick: () => { const date = $('#pastDate').value; if (!date) return; mealPicker('Dinner on ' + fmtDate(date), id => logMeal(id, date, true), true); },
  pastOut: () => { const date = $('#pastDate').value; if (!date) return; closeSheet(); logOut(date); render(); },
  delLog: el => { if (!armed(el)) return; state.log = state.log.filter(e => e.id !== el.dataset.id); save(); render(); },
  addFirst: () => { const v = $('#firstStart').value; if (!v) return; state.periods.push({start: v}); save(); render(); },
  periodStart: () => {
    const t = today(); const st = cycleStats(); const last = st.ps[st.ps.length - 1];
    if (last && diff(t, last.start) < 10){ toast('A period starting ' + fmtDate(last.start) + ' is already logged.'); return; }
    state.periods.push({start: t}); save(); render(); toast('Logged period start');
  },
  periodEnd: () => { const t = today(); const st = cycleStats(); const last = st.ps[st.ps.length - 1]; const p = state.periods.find(x => x.start === last.start); p.end = t; save(); render(); toast('Logged period end'); },
  periodOther: () => {
    openSheet('Log a period date', '<label class="field"><span>Date</span><input type="date" id="perDate" max="' + today() + '" value="' + today() + '"></label><div class="btns"><button class="btn primary" data-act="perStart">Started this day</button><button class="btn" data-act="perEnd">Ended this day</button></div>');
  },
  perStart: () => {
    const v = $('#perDate').value; if (!v) return;
    if (state.periods.some(p => Math.abs(diff(p.start, v)) < 10)){ toast('Another period start is within 10 days of that date.'); return; }
    state.periods.push({start: v}); save(); closeSheet(); toast('Logged period start');
  },
  perEnd: () => {
    const v = $('#perDate').value; if (!v) return;
    const cand = state.periods.filter(p => p.start <= v && diff(v, p.start) <= 14).sort((a, b) => a.start < b.start ? 1 : -1)[0];
    if (!cand){ toast('Log the start of that period first.'); return; }
    cand.end = v; save(); closeSheet(); toast('Logged period end');
  },
  delPeriod: el => { if (!armed(el)) return; state.periods = state.periods.filter(p => p.start !== el.dataset.start); save(); render(); },
  phaseNut: el => { const m = state.settings.phaseMap[el.dataset.p] = state.settings.phaseMap[el.dataset.p] || {}; const n = el.dataset.n; const w = m[n] || 0; if (w >= 2) delete m[n]; else m[n] = w + 1; save(); render(); },
  resetPhaseMap: el => { if (!armed(el)) return; state.settings.phaseMap = JSON.parse(JSON.stringify(DEFAULT_PHASE_MAP)); save(); render(); },
  city: el => { state.city = el.dataset.v; save(); render(); ensureWeather(true); },
  refreshWx: () => ensureWeather(true),
  wkday: el => { const v = +el.dataset.v; const w = state.settings.weekendDays; const i = w.indexOf(v); if (i >= 0) w.splice(i, 1); else w.push(v); save(); render(); },
  export: () => exportData(),
  import: () => $('#importFile').click(),
  doImport: () => { state = migrate(importFile.pending); save(); closeSheet(); toast('Backup restored'); },
  eraseAll: el => { if (!armed(el)) return; state = defaultState(false); save(); render(); toast('Everything erased'); },
  tagIng: el => tagIngredient(el.dataset.name),
  'ti-n': el => { const t = tagIngredient.tmp; const v = el.dataset.v; const i = t.flags.indexOf(v); if (i >= 0) t.flags.splice(i, 1); else t.flags.push(v); t.pantry = $('#ti-pantry').checked; tagIngredient.redraw(); },
  'ed-schedType': el => { draft.sched = el.dataset.v === 'phase' ? {type:'phase', phase: (draft.sched && draft.sched.phase) || 'luteal'} : {type:'days', days: (draft.sched && draft.sched.days) || state.settings.defaultDays}; renderEditor(); },
  'ed-schedPhase': el => { draft.sched = {type:'phase', phase: el.dataset.v}; renderEditor(); },
  'ed-days': el => { draft.sched = {type:'days', days: +el.dataset.v}; renderEditor(); },
  'ed-when': el => { draft.when = el.dataset.v; renderEditor(); },
  'ed-vibe': el => { const v = el.dataset.v; draft.vibes = draft.vibes.includes(v) ? draft.vibes.filter(x => x !== v) : draft.vibes.concat(v); renderEditor(); },
  'ed-phase': el => { const v = el.dataset.v; draft.phases = draft.phases.includes(v) ? draft.phases.filter(x => x !== v) : draft.phases.concat(v); renderEditor(); },
  'ed-yearround': () => { draft.months = null; renderEditor(); },
  'ed-month': el => { const v = +el.dataset.v; let ms = draft.months && draft.months.length < 12 ? draft.months.slice() : []; ms = ms.includes(v) ? ms.filter(x => x !== v) : ms.concat(v); draft.months = ms.length && ms.length < 12 ? ms : null; renderEditor(); },
  'ed-nut': el => {
    const n = el.dataset.v; const {auto} = mealNutrients(draft, parseIngs(draft.ingsText)); const o = draft.nOver;
    if (auto[n]){ if (o[n] === false) delete o[n]; else o[n] = false; }
    else { if (o[n] === true) delete o[n]; else o[n] = true; }
    $('#nutChips').innerHTML = nutChipsHTML();
  },
  'ed-delete': el => { if (!armed(el)) return; const id = draft.id; state.meals = state.meals.filter(m => m.id !== id); if (state.plan) state.plan.days.forEach(d => { if (d.mealId === id) d.mealId = null; }); save(); closeSheet(); toast('Meal deleted'); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (e.target === $('#sheet')) cancelSheet(); return; }
  const f = ACT[el.dataset.act];
  if (!f) return;
  if (el.tagName !== 'INPUT') e.preventDefault();
  f(el, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'mealSearch'){ ui.q = t.value; $('#mealList').innerHTML = mealListHTML(); return; }
  if (t.id === 'pickSearch'){ ui.pickQ = t.value; $('#pickList').innerHTML = pickListHTML(mealPicker.allowNew); return; }
  if (draft && t.dataset.f){
    const f = t.dataset.f;
    if (f === 'active') draft.active = t.checked;
    else if (f === 'days') draft.sched = {type:'days', days: Number(t.value) || ''};
    else draft[f] = t.value;
    if (f === 'ingsText'){ $('#ingPreview').innerHTML = ingPreviewHTML(); $('#nutChips').innerHTML = nutChipsHTML(); }
    if (f === 'days') document.querySelectorAll('[data-act="ed-days"]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === draft.sched.days)));
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.set){
    const v = Math.round(Number(t.value));
    if (!Number.isFinite(v)) return;
    const lim = {coldMax:[0, 90], hotMin:[50, 120], defaultDays:[1, 365]}[t.dataset.set];
    state.settings[t.dataset.set] = Math.min(lim[1], Math.max(lim[0], v));
    save(); toast('Saved');
  }
  if (t.id === 'importFile' && t.files[0]){ importFile(t.files[0]); t.value = ''; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) cancelSheet(); });

/* ============ router ============ */
const VIEWS = {tonight: viewTonight, plan: viewPlan, meals: viewMeals, cycle: viewCycle, settings: viewSettings};
function currentTab(){ const h = (location.hash || '').slice(1); return VIEWS[h] ? h : 'tonight'; }
function render(){
  const tab = currentTab();
  const y = window.scrollY;
  $('#view').innerHTML = VIEWS[tab]();
  document.querySelectorAll('#tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.tab === tab ? 'page' : 'false'));
  if (render.lastTab === tab) window.scrollTo(0, y); else window.scrollTo(0, 0);
  render.lastTab = tab;
}
window.addEventListener('hashchange', render);
let lastDay = null;
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ if (lastDay !== today()){ lastDay = today(); render(); } ensureWeather(false); } });

load();
lastDay = today();
render();
ensureWeather(false);
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
